      <path d="M255 183 C238 206 236 226 244 241 C219 238 212 263 223 282 C232 297 245 308 255 331 C266 308 279 299 288 283 C299 262 291 240 268 241 C275 228 273 206 255 183 Z" fill="url(#innerfire)"/>
      <text x="256" y="430" text-anchor="middle" font-size="22" letter-spacing="3" font-family="Arial, sans-serif" fill="#6D4D3B">21 DAY STREAK</text>
