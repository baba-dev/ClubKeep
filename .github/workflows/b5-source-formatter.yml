name: B5 temporary source formatter
on:
  push:
    branches: ["feat/b5-member-experience"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: b5-formatter
  cancel-in-progress: false

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: feat/b5-member-experience
          persist-credentials: true
      - name: Set up Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install pinned dependencies
        env:
          HUSKY: "0"
        run: npm ci --no-fund
      - name: Format changed source/tests using project Prettier configuration
        run: npx prettier --write src tests
      - name: Commit formatting if needed
        env:
          HUSKY: "0"
        run: |
          set -Eeuo pipefail
          if ! git diff --quiet -- src tests; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src tests
            git commit -m "style(B5): apply project Prettier and Tailwind class order"
            git push origin HEAD:feat/b5-member-experience
          fi
