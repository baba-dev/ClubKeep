<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" width="1600" height="800" fill="none" aria-hidden="true" role="img">
  <defs>
        <radialGradient id="sunGlow" cx="74%" cy="27%" r="28%">
          <stop offset="0%" stop-color="#D89268" stop-opacity="0.42"/>
          <stop offset="58%" stop-color="#B86A47" stop-opacity="0.18"/>
          <stop offset="100%" stop-color="#B86A47" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="skyArcGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#4C332B" stop-opacity="0.44"/>
          <stop offset="100%" stop-color="#8B513E" stop-opacity="0.26"/>
        </linearGradient>
        <linearGradient id="distantGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#6E463A" stop-opacity="0.36"/>
          <stop offset="100%" stop-color="#99604C" stop-opacity="0.38"/>
        </linearGradient>
        <linearGradient id="midGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#8A523F" stop-opacity="0.42"/>
          <stop offset="100%" stop-color="#B46C50" stop-opacity="0.48"/>
        </linearGradient>
        <linearGradient id="frontGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#A66249" stop-opacity="0.48"/>
          <stop offset="100%" stop-color="#D0855F" stop-opacity="0.54"/>
        </linearGradient>
        <linearGradient id="pathGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#E4B894" stop-opacity="0.22"/>
          <stop offset="100%" stop-color="#C07A58" stop-opacity="0.12"/>
        </linearGradient>
        </defs>
  
<style>
  .drift-a { animation: driftA 26s ease-in-out infinite alternate; }
  .drift-b { animation: driftB 33s ease-in-out infinite alternate; }
  .drift-c { animation: driftC 29s ease-in-out infinite alternate; }
  .glow-a { animation: glowA 18s ease-in-out infinite alternate; }
  @keyframes driftA { from { transform: translateY(0px); } to { transform: translateY(-4px); } }
  @keyframes driftB { from { transform: translateY(0px); } to { transform: translateY(3px); } }
  @keyframes driftC { from { transform: translateY(0px); } to { transform: translateY(-2px); } }
  @keyframes glowA { from { opacity: 0.82; } to { opacity: 0.96; } }
  @media (prefers-reduced-motion: reduce) {
    .drift-a, .drift-b, .drift-c, .glow-a { animation: none !important; }
  }
</style>

  <g class="glow-a">
    <circle cx="1180" cy="220" r="160" fill="url(#sunGlow)"/>
  </g>
  <g class="drift-a">
    <path d="M0 415 C 210 365, 345 332, 520 324 C 710 315, 900 372, 1110 352 C 1270 337, 1440 268, 1600 208 L1600 800 L0 800 Z" fill="url(#skyArcGrad)"/>
    <path d="M1080 205 C1168 160, 1274 166, 1352 208" stroke="#8B5A47" stroke-opacity="0.22" stroke-width="4" stroke-linecap="round"/>
  </g>
  <g class="drift-b"><path d="M0 480 C 168 445, 275 392, 470 400 C 635 406, 740 476, 900 474 C 1080 471, 1230 385, 1390 393 C 1505 399, 1554 432, 1600 462 L1600 800 L0 800 Z" fill="url(#distantGrad)"/></g>
