  <path d="M990 800 C 967 760, 931 709, 883 659 C 833 607, 746 566, 666 536 C 588 507, 536 481, 498 447 C 459 412, 408 392, 338 382 C 286 375, 244 381, 196 396 C 188 398, 184 406, 190 414 C 237 400, 278 397, 323 402 C 385 410, 433 430, 472 462 C 512 494, 568 523, 642 551 C 720 580, 804 620, 855 677 C 897 723, 926 760, 947 800 Z" fill="url(#pathGrad)"/>
