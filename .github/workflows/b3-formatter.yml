name: B3 one-time source formatter
on:
  push:
    branches: [feat/b3-unified-multivertical-discovery]
permissions:
  contents: write
jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[b3-fmt-done]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        env:
          HUSKY: "0"
      - name: Format B3 code on the dedicated same-repository feature branch only
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "feat/b3-unified-multivertical-discovery"
          npx prettier --write src tests prisma.config.ts next.config.ts
          if ! git diff --quiet -- src tests prisma.config.ts next.config.ts; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src tests prisma.config.ts next.config.ts
            git commit -m "style(B3): apply Prettier [b3-fmt-done]"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
