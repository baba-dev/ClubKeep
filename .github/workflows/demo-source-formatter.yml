name: Demo branch transient source formatter
on:
  push:
    branches: ["fix/onboarding-demo-access"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: demo-format-branch
  cancel-in-progress: false
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: fix/onboarding-demo-access
          persist-credentials: true
      - name: Setup Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install pinned dependencies
        env:
          HUSKY: "0"
        run: npm ci --no-fund
      - name: Apply project Prettier and Tailwind class ordering
        run: npx prettier --write src tests
      - name: Commit formatting only when changed
        env:
          HUSKY: "0"
        run: |
          set -Eeuo pipefail
          if ! git diff --quiet -- src tests; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src tests
            git commit -m "style(demo): apply project Prettier to new admin and preview screens"
            git push origin HEAD:fix/onboarding-demo-access
          fi
