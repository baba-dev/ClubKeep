name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clubkeep-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Quality and native service smoke (x64)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      HUSKY: "0"
      DATABASE_URL: postgresql://clubkeep_ci:ci-only-synthetic@127.0.0.1:5432/clubkeep_ci?schema=public
      REDIS_URL: redis://127.0.0.1:6379
      BETTER_AUTH_SECRET: ci-only-synthetic-secret-not-for-production-123456789
      BETTER_AUTH_URL: https://ci.clubkeep.invalid
      NEXT_PUBLIC_APP_URL: https://ci.clubkeep.invalid
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate shell deploy and retention scripts
        run: |
          set -Eeuo pipefail
          bash -n infra/deploy/clubkeep-release.sh
          bash -n infra/deploy/package-release.sh
          bash -n infra/deploy/smoke-lean-release.sh
          node --check infra/deploy/build-migration-kit.mjs
          node --check infra/deploy/verify-lean-release.mjs
          bash -n infra/deploy/clubkeep-cleanup.sh
          bash -n infra/deploy/clubkeep-node24-rollback.sh
          if bash infra/deploy/clubkeep-node24-rollback.sh --apply > /dev/null 2>&1; then
            echo "Unsafe operator-only runtime rollback accepted on non-root runner" >&2
            exit 1
          fi
          # Non-root runners must not be permitted to prune production paths.
          if bash infra/deploy/clubkeep-cleanup.sh --apply > /dev/null 2>&1; then
            echo "Unsafe retention: non-root apply was accepted" >&2
            exit 1
          fi

      - name: Set up Node 26.13.1
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check committed source formatting (show suggested diff)
        run: |
          npx prettier --write src tests prisma.config.ts next.config.ts
          git diff --exit-code -- src tests prisma.config.ts next.config.ts

      - name: Reject conflicting Next.js route parameter names
        run: node infra/deploy/check-route-segments.mjs

      - name: Validate and generate Prisma client (no migration in Phase 0A)
        run: |
          npm run db:validate
          npm run db:generate

      - name: Lint, format, and typecheck
        run: |
          npm run lint
          npm run format:check
          npm run typecheck

      - name: Node runtime / release manifest regression suite
        run: node --test tests/unit/node-runtime-migration.test.mjs

      - name: Unit tests
        run: npm run test

      - name: Start native PostgreSQL and Redis on hosted runner
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq postgresql redis-server
          sudo systemctl start postgresql
          sudo systemctl start redis-server
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "CREATE ROLE clubkeep_ci LOGIN PASSWORD 'ci-only-synthetic'"
          sudo -u postgres createdb -O clubkeep_ci clubkeep_ci
          pg_isready -h 127.0.0.1 -p 5432
          redis-cli -h 127.0.0.1 -p 6379 ping

      - name: Native service integration smoke
        run: npm run test:integration

      - name: Atomic authentication abuse-limit smoke on native Redis
        run: node --test tests/integration/auth-rate-limit.test.mjs

      - name: Build Next.js
        run: npm run build

      - name: Smoke test actual x64 standalone runtime
        run: bash infra/deploy/smoke-standalone.sh

      - name: Audit production dependency critical vulnerabilities
        run: npm run security:audit

  arm64:
    name: Production architecture smoke (ARM64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    env:
      HUSKY: "0"
      DATABASE_URL: postgresql://clubkeep_ci:ci-only-synthetic@127.0.0.1:5432/clubkeep_ci?schema=public
      REDIS_URL: redis://127.0.0.1:6379
      BETTER_AUTH_SECRET: ci-only-synthetic-secret-not-for-production-123456789
      BETTER_AUTH_URL: https://ci.clubkeep.invalid
      NEXT_PUBLIC_APP_URL: https://ci.clubkeep.invalid
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node 26.13.1
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate and generate Prisma client
        run: |
          npm run db:validate
          npm run db:generate

      - name: Typecheck
        run: npm run typecheck

      - name: Reject conflicting route segment names on ARM64
        run: node infra/deploy/check-route-segments.mjs

      - name: Build standalone output on ARM64
        run: npm run build

      - name: Smoke test actual ARM64 standalone runtime
        run: bash infra/deploy/smoke-standalone.sh

      - name: Build and smoke the exact ARM64 lean release artifact
        run: |
          set -Eeuo pipefail
          archive="clubkeep-$GITHUB_SHA-linux-arm64.tar.gz"
          bash infra/deploy/package-release.sh "$GITHUB_SHA"
          bash infra/deploy/smoke-lean-release.sh "$archive" "$GITHUB_SHA"
          echo "## ClubKeep lean archive" >> "$GITHUB_STEP_SUMMARY"
          echo "Archive: $(du -h "$archive" | cut -f1)" >> "$GITHUB_STEP_SUMMARY"
          echo "Prisma migration kit and standalone server verified in isolation." >> "$GITHUB_STEP_SUMMARY"

  migrations:
    name: PostgreSQL 17 baseline and identity migrations (native)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      HUSKY: "0"
      BETTER_AUTH_SECRET: ci-synthetic-only-not-for-any-production-123456789
      BETTER_AUTH_URL: https://ci.clubkeep.invalid
      NEXT_PUBLIC_APP_URL: https://ci.clubkeep.invalid
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node 26.13.1
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install native PostgreSQL 17 (only on disposable hosted runner)
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ca-certificates curl postgresql-common
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          printf 'Types: deb\nURIs: https://apt.postgresql.org/pub/repos/apt\nSuites: noble-pgdg\nComponents: main\nSigned-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc\n' | sudo tee /etc/apt/sources.list.d/pgdg.sources >/dev/null
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq postgresql-17
          # Some hosted images disable auto-creation of a 17/main cluster.
          # Create one only on this disposable GitHub-hosted runner.
          if ! pg_lsclusters -h | awk '$1 == "17" && $2 == "main" { found=1 } END { exit !found }'; then
            sudo pg_createcluster 17 main -p 5543 --start
          fi
          PG17_PORT="$(pg_lsclusters -h | awk '$1 == "17" && $2 == "main" { print $3 }')"
          test -n "$PG17_PORT"
          if ! pg_isready -p "$PG17_PORT"; then sudo pg_ctlcluster 17 main start; fi
          PG17_PORT="$(pg_lsclusters -h | awk '$1 == "17" && $2 == "main" { print $3 }')"
          sudo -u postgres psql -p "$PG17_PORT" -v ON_ERROR_STOP=1 -c "CREATE ROLE clubkeep_ci WITH LOGIN PASSWORD 'ci-only-synthetic'"
          sudo -u postgres createdb -p "$PG17_PORT" -O clubkeep_ci clubkeep_ci
          echo "PG17_PORT=$PG17_PORT" >> "$GITHUB_ENV"
          echo "DATABASE_URL=postgresql://clubkeep_ci:ci-only-synthetic@127.0.0.1:$PG17_PORT/clubkeep_ci?schema=public" >> "$GITHUB_ENV"
          sudo -u postgres psql -p "$PG17_PORT" -Atqc "SHOW server_version"
      - name: Validate Prisma 7 schema and generate types
        run: |
          npm run db:validate
          npm run db:generate
          npm run typecheck
      - name: Fresh migration and no-op redeploy
        run: |
          set -euo pipefail
          npm run db:deploy
          npm run db:deploy
          npx prisma migrate status
          npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
      - name: Verify standalone Prisma migration kit against fresh PostgreSQL 17
        run: |
          set -Eeuo pipefail
          scratch="$(mktemp -d)"
          trap 'rm -rf -- "$scratch"' EXIT
          node infra/deploy/build-migration-kit.mjs "$scratch/migrate"
          sudo -u postgres createdb -p "$PG17_PORT" -O clubkeep_ci clubkeep_lean_ci
          export DATABASE_URL="postgresql://clubkeep_ci:ci-only-synthetic@127.0.0.1:$PG17_PORT/clubkeep_lean_ci?schema=public"
          (
            cd "$scratch/migrate"
            env -u NODE_PATH node node_modules/prisma/build/index.js validate
            env -u NODE_PATH node node_modules/prisma/build/index.js migrate deploy
            env -u NODE_PATH node node_modules/prisma/build/index.js migrate deploy
            env -u NODE_PATH node node_modules/prisma/build/index.js migrate status
          )
          test "$(sudo -u postgres psql -p "$PG17_PORT" -d clubkeep_lean_ci -Atqc 'SELECT count(*) FROM "_prisma_migrations" WHERE finished_at IS NOT NULL')" -gt 0
      - name: Validate constraints with real PostgreSQL 17
        run: npm run test:identity
      - name: Concurrent one-time club invitation redemption on PostgreSQL 17
        run: node --test tests/integration/onboarding-claim.test.mjs
      - name: Validate B1 roster/plan/term schema and tenant isolation on PostgreSQL 17
        run: node --test tests/integration/business-schema.test.mjs
      - name: Validate B2 attendance constraints and tenant isolation on PostgreSQL 17
        run: node --test tests/integration/attendance-schema.test.mjs
      - name: Validate B3 schema constraints and public revision safety on PostgreSQL 17
        run: node --test tests/integration/b3-schema.test.mjs
      - name: Validate B4 append-only payments, receipt uniqueness and tenant constraints on PG17
        run: node --test tests/integration/b4-finance-schema.test.mjs
      - name: Validate B4 club-local month bucketing of payments (UTC to Asia/Kolkata) on PG17
        run: node --test tests/integration/b4-finance-timezone.test.mjs
      - name: Validate B5 renewal requests, tenant isolation and pending uniqueness on PG17
        run: node --test tests/integration/b5-renewal-schema.test.mjs
      - name: Validate B6 score immutability, consent, tenant isolation and challenges on PostgreSQL 17
        run: node --test tests/integration/b6-performance-schema.test.mjs
      - name: Validate B7 owner insights queries, club-local time and tenant isolation on PG17
        run: node --test tests/integration/b7-insights.test.mjs
      - name: Validate B8 billing constraints, idempotent webhooks, grace and tenant isolation on PG17
        run: node --test tests/integration/b8-billing.test.mjs
      - name: Validate B8 Stripe binding, retries, ordering and portal on PG17
        run: node --test tests/integration/b8-stripe.test.mjs
      - name: Validate Personal bio, measurement privacy, consent and erase paths on PG17
        run: node --test tests/integration/personal-service.test.mjs
      - name: Validate B8 operator billing tools (dry run, grant, revoke, reconcile parity) on PG17
        run: |
          bash -n infra/billing/clubkeep-billing-ops.sh
          node --test tests/integration/b8-billing-ops.test.mjs
      - name: Verify isolated demo reviewer sandbox on clean PostgreSQL 17
        run: |
          set -Eeuo pipefail
          sudo -u postgres createdb -p "$PG17_PORT" -O clubkeep_ci clubkeep_demo_ci
          export DATABASE_URL="postgresql://clubkeep_ci:ci-only-synthetic@127.0.0.1:$PG17_PORT/clubkeep_demo_ci?schema=public"
          export BETTER_AUTH_URL="https://demo.clubkeep.invalid"
          export NEXT_PUBLIC_APP_URL="$BETTER_AUTH_URL"
          npm run db:deploy
          printf '%s' '{"owner":"ci-owner-synthetic-secret","member":"ci-member-synthetic-secret","manager":"ci-manager-synthetic-secret","staff":"ci-staff-synthetic-secret"}' |
            CLUBKEEP_DEMO_SANDBOX=true node prisma/seed-demo-sandbox.mjs --expect-db clubkeep_demo_ci
          node --test tests/integration/demo-sandbox.test.mjs
      - name: One-time platform administrator provisioning on isolated PostgreSQL 17
        run: node --test tests/integration/platform-bootstrap.test.mjs
      - name: Platform administrator bootstrap from the isolated migration kit on PostgreSQL 17
        run: |
          set -Eeuo pipefail
          scratch="$(mktemp -d)"
          trap 'rm -rf -- "$scratch"' EXIT
          node infra/deploy/build-migration-kit.mjs "$scratch/migrate"
          sudo -u postgres createdb -p "$PG17_PORT" -O clubkeep_ci clubkeep_ci_bootstrap_kit
          export DATABASE_URL="postgresql://clubkeep_ci:ci-only-synthetic@127.0.0.1:$PG17_PORT/clubkeep_ci_bootstrap_kit?schema=public"
          (cd "$scratch/migrate" && env -u NODE_PATH node node_modules/prisma/build/index.js migrate deploy)
          CLUBKEEP_BOOTSTRAP_SCRIPT="$scratch/migrate/prisma/bootstrap-platform-admin.mjs" \
            node --test tests/integration/platform-bootstrap.test.mjs
      - name: Legacy unversioned Better Auth baseline and populated upgrade
        run: |
          set -euo pipefail
          sudo -u postgres createdb -p "$PG17_PORT" -O clubkeep_ci clubkeep_legacy_ci
          export DATABASE_URL="postgresql://clubkeep_ci:ci-only-synthetic@127.0.0.1:$PG17_PORT/clubkeep_legacy_ci?schema=public"
          psql "${DATABASE_URL%%\?*}" -v ON_ERROR_STOP=1 -f prisma/migrations/0_init_auth_core/migration.sql
          npx prisma migrate diff --from-config-datasource --to-schema prisma/baseline/auth-core.prisma --exit-code
          psql "${DATABASE_URL%%\?*}" -v ON_ERROR_STOP=1 -f tests/fixtures/legacy-auth.sql
          npx prisma migrate resolve --applied 0_init_auth_core
          npm run db:deploy
          npm run db:deploy
          npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
          node --test tests/integration/legacy-preservation.test.mjs
      - name: Duplicate provider identity must fail atomically
        run: |
          set -euo pipefail
          sudo -u postgres createdb -p "$PG17_PORT" -O clubkeep_ci clubkeep_collision_ci
          export DATABASE_URL="postgresql://clubkeep_ci:ci-only-synthetic@127.0.0.1:$PG17_PORT/clubkeep_collision_ci?schema=public"
          psql "${DATABASE_URL%%\?*}" -v ON_ERROR_STOP=1 -f prisma/migrations/0_init_auth_core/migration.sql
          psql "${DATABASE_URL%%\?*}" -v ON_ERROR_STOP=1 -c "INSERT INTO \"user\" (\"id\",\"name\",\"email\",\"updatedAt\") VALUES ('u1','One','u1@example.invalid',NOW()),('u2','Two','u2@example.invalid',NOW())"
          psql "${DATABASE_URL%%\?*}" -v ON_ERROR_STOP=1 -c "INSERT INTO \"account\" (\"id\",\"accountId\",\"providerId\",\"userId\",\"updatedAt\") VALUES ('a1','external-subject','google','u1',NOW()),('a2','external-subject','google','u2',NOW())"
          npx prisma migrate resolve --applied 0_init_auth_core
          if npm run db:deploy >/dev/null 2>&1; then
            echo "ERROR: duplicate provider identities were accepted"
            exit 1
          fi
          test "$(psql "${DATABASE_URL%%\?*}" -Atqc 'SELECT count(*) FROM "account"')" = "2"
          test "$(psql "${DATABASE_URL%%\?*}" -Atqc 'SELECT count(*) FROM pg_tables WHERE schemaname = '\''public'\'' AND tablename = '\''ClubMembership'\''')" = "0"
          echo "Expected uniqueness failure preserved all legacy account records"
