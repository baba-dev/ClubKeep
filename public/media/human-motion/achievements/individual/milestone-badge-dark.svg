<style>
  .float-a { animation: floatA 8s ease-in-out infinite alternate; }
  .float-b { animation: floatB 7s ease-in-out infinite alternate; }
  .glow-a { animation: glowA 5s ease-in-out infinite alternate; }
  @keyframes floatA { from { transform: translateY(0px); } to { transform: translateY(-2px); } }
  @keyframes floatB { from { transform: translateY(0px); } to { transform: translateY(2px); } }
  @keyframes glowA { from { opacity: .92; } to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    .float-a, .float-b, .glow-a { animation: none !important; }
  }
</style>

