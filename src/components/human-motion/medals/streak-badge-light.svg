<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none" role="img" aria-hidden="true">
<style>
  .float-a { animation: floatA 8s ease-in-out infinite alternate; }
  .float-b { animation: floatB 7s ease-in-out infinite alternate; }
  .glow-a { animation: glowA 5s ease-in-out infinite alternate; }
  @keyframes floatA { from { transform: translateY(0px); } to { transform: translateY(-2px); } }
  @keyframes floatB { from { transform: translateY(0px); } to { transform: translateY(2px); } }
  @keyframes glowA { from { opacity: .92; } to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    .float-a, .float-b, .glow-a { animation: none !important; }
  }
</style>

    <defs>
        <radialGradient id="ring" cx="50%" cy="40%" r="60%"><stop offset="0%" stop-color="#F7E7D4"/><stop offset="100%" stop-color="#E2C6A3"/></radialGradient>
        <linearGradient id="fire" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#E9A16F"/><stop offset="55%" stop-color="#CC744E"/><stop offset="100%" stop-color="#9F5039"/></linearGradient>
        <linearGradient id="innerfire" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#FFE8C0"/><stop offset="100%" stop-color="#F0B266"/></linearGradient>
        </defs>
    <ellipse cx="256" cy="434" rx="110" ry="18" fill="rgba(155,112,84,0.18)"/>
    <g class="glow-a">
      <circle cx="256" cy="256" r="146" fill="url(#ring)"/>
